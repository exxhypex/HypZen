name: Manual Build and Send APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      telegram_chat_id:
        description: "Telegram chat id (example: 123456789 or -1001234567890)"
        required: true
        type: string
      telegram_caption:
        description: "Custom caption prefix (optional)"
        required: false
        default: ""
        type: string

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUILD_TYPE: ${{ inputs.build_type }}
      TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
      TELEGRAM_CAPTION: ${{ inputs.telegram_caption }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # Optional release signing secrets (needed only when build_type=release):
      # KEYSTORE_JKS_BASE64: base64 of himelkeystore.jks
      KEYSTORE_JKS_BASE64: ${{ secrets.KEYSTORE_JKS_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" ]]; then
            echo "Missing secret TELEGRAM_BOT_TOKEN."
            exit 1
          fi

      - name: Prepare Release Keystore (release only)
        if: ${{ inputs.build_type == 'release' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_JKS_BASE64:-}" ]]; then
            echo "Missing secret KEYSTORE_JKS_BASE64 for release signing."
            exit 1
          fi
          if [[ -z "${RELEASE_STORE_PASSWORD:-}" || -z "${RELEASE_KEY_ALIAS:-}" || -z "${RELEASE_KEY_PASSWORD:-}" ]]; then
            echo "Missing one of: RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD."
            exit 1
          fi
          echo "${KEYSTORE_JKS_BASE64}" | base64 --decode > himelkeystore.jks

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          if [[ "${BUILD_TYPE}" == "release" ]]; then
            ./gradlew :app:assembleRelease \
              -PRELEASE_STORE_FILE=himelkeystore.jks \
              -PRELEASE_STORE_PASSWORD="${RELEASE_STORE_PASSWORD}" \
              -PRELEASE_KEY_ALIAS="${RELEASE_KEY_ALIAS}" \
              -PRELEASE_KEY_PASSWORD="${RELEASE_KEY_PASSWORD}"
          else
            ./gradlew :app:assembleDebug
          fi

      - name: Upload APK(s) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ inputs.build_type }}
          path: app/build/outputs/apk/${{ inputs.build_type }}/*.apk
          if-no-files-found: error

      - name: Send APK(s) to Telegram
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="app/build/outputs/apk/${BUILD_TYPE}"
          if [[ ! -d "${OUT_DIR}" ]]; then
            echo "APK output dir not found: ${OUT_DIR}"
            ls -la app/build/outputs/apk || true
            exit 1
          fi

          mapfile -t APKS < <(find "${OUT_DIR}" -maxdepth 1 -type f -name '*.apk' | sort)
          if [[ ${#APKS[@]} -eq 0 ]]; then
            echo "No APKs found in ${OUT_DIR}"
            echo "Listing outputs:"
            ls -la app/build/outputs/apk || true
            find app/build/outputs -maxdepth 4 -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "Found ${#APKS[@]} APK(s) in ${OUT_DIR}:"
          printf '%s\n' "${APKS[@]}"

          send_message() {
            local text="$1"
            curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "text=${text}" \
              >/dev/null
          }

          i=0
          sent_ok=0
          for APK_PATH in "${APKS[@]}"; do
            i=$((i+1))
            APK_NAME="$(basename "${APK_PATH}")"
            APK_BYTES="$(stat -c%s "${APK_PATH}")"
            APK_MB="$(( (APK_BYTES + 1024*1024 - 1) / (1024*1024) ))"
            if [[ -n "${TELEGRAM_CAPTION:-}" ]]; then
              PREFIX="${TELEGRAM_CAPTION}"
            else
              PREFIX="HypZen"
            fi

            CAPTION="$(printf '%s\n' \
              "${PREFIX} ${BUILD_TYPE} APK (${i}/${#APKS[@]})" \
              "file=${APK_NAME}" \
              "size=${APK_MB}MB" \
              "repo=${GITHUB_REPOSITORY}" \
              "ref=${GITHUB_REF_NAME}" \
              "sha=${GITHUB_SHA}")"

            # Telegram bots commonly fail with "file is too big" around ~50MB. Skip big APKs but keep them as artifacts.
            if [[ "${APK_MB}" -ge 49 ]]; then
              echo "Skipping Telegram upload (too large): ${APK_NAME} (${APK_MB}MB)"
              send_message "$(printf '%s\n' "${CAPTION}" "note=skipped telegram upload (file too large). download from workflow artifacts.")" || true
              continue
            fi

            RESP="$(curl -sS \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "caption=${CAPTION}" \
              -F "document=@${APK_PATH}" || true)"
            echo "Telegram response for ${APK_NAME}: ${RESP}"
            if echo "${RESP}" | grep -q '\"ok\":true'; then
              sent_ok=$((sent_ok+1))
            fi
            sleep 1
          done

          if [[ "${sent_ok}" -eq 0 ]]; then
            echo "No APKs were successfully sent to Telegram. Check chat_id/bot permissions or Telegram API response above."
            exit 1
          fi
